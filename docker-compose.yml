services:
  backend:
    build:
      context: ./backend
    environment:
      SURREALDB_URL: ws://surrealdb:8000
      SURREALDB_NAMESPACE: main
      SURREALDB_DATABASE: main
      SURREALDB_USERNAME: root
      SURREALDB_PASSWORD: root
      VALHALLA_URL: http://valhalla:8002
      MOTIS_URL: http://motis:8080
    ports:
      - "8000:8000"
    depends_on:
      surrealdb:
        condition: service_started
      valhalla:
        condition: service_started
      motis:
        condition: service_started

  surrealdb:
    image: surrealdb/surrealdb:latest-dev
    command:
      - start
      - --user
      - root
      - --pass
      - root
      - rocksdb:/data/questmap.db
    ports:
      - "8001:8000"
    volumes:
      - surrealdb-data:/data

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    entrypoint: ["/usr/bin/bash", "-lc"]
    command:
      - |
        until test -f /custom_files/.data-ready; do
          echo "Waiting for MOTIS/Valhalla data volume..."
          sleep 30
        done
        exec /valhalla/scripts/docker-entrypoint.sh build_tiles
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-}
      server_threads: ${VALHALLA_SERVER_THREADS:-2}
      use_tiles_ignore_pbf: ${VALHALLA_USE_TILES_IGNORE_PBF:-False}
      build_elevation: ${VALHALLA_BUILD_ELEVATION:-False}
      build_admins: ${VALHALLA_BUILD_ADMINS:-True}
      build_time_zones: ${VALHALLA_BUILD_TIME_ZONES:-True}
      build_tar: ${VALHALLA_BUILD_TAR:-True}
      serve_tiles: "True"
    ports:
      - "8002:8002"
    volumes:
      - valhalla-data:/custom_files
    depends_on:
      motis-data:
        condition: service_started

  motis:
    build:
      context: ./motis
      args:
        MOTIS_VERSION: ${MOTIS_RELEASE:-v2.10.2}
        TARGETARCH: ${MOTIS_TARGETARCH:-amd64}
    command:
      - /bin/sh
      - -lc
      - |
        until test -f /data/.motis-imported; do
          echo "Waiting for MOTIS data import..."
          sleep 30
        done
        exec /motis server /data
    ports:
      - "${MOTIS_PORT:-8010}:8080"
    volumes:
      - motis-data:/data:ro
    depends_on:
      motis-data:
        condition: service_started

  motis-data:
    build:
      context: ./motis
      dockerfile: Dockerfile.data
      args:
        MOTIS_VERSION: ${MOTIS_RELEASE:-v2.10.2}
        TARGETARCH: ${MOTIS_TARGETARCH:-amd64}
    environment:
      DATA_SERVICE_KEEP_ALIVE: ${DATA_SERVICE_KEEP_ALIVE:-true}
      FORCE_DATA_REFRESH: ${FORCE_DATA_REFRESH:-false}
    volumes:
      - motis-data:/data
      - valhalla-data:/valhalla
    restart: unless-stopped

volumes:
  motis-data:
  valhalla-data:
  surrealdb-data:
